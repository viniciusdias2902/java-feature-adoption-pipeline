[project]
name = "jmod"
version = "0.1.0"
description = "Longitudinal study of Java baseline upgrades and language feature adoption"
requires-python = ">=3.12"
dependencies = [
    "tree-sitter>=0.23",
    "tree-sitter-java>=0.23",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
analysis = ["pandas>=2.2", "pyarrow>=16", "lifelines>=0.28", "statsmodels>=0.14", "matplotlib>=3.8"]

[project.scripts]
jmod = "jmod.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jmod"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/jmod"]

[[tool.mypy.overrides]]
module = ["pandas", "pandas.*", "lifelines", "lifelines.*", "matplotlib", "matplotlib.*", "numpy", "numpy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
